global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'django'
    scrape_interval: 5s
    metrics_path: '/prometheus/metrics'
    scheme: 'https'
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['app:8000']

# THis has to run in the command prompt
# prometheus.exe --config.file=prometheus.yml